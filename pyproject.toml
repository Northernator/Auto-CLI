[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cli"
version = "0.1.0"
description = "REA recon in, CLI-Anything harness out: reverse-engineer an app's automation surface, then forge a registry-ready CLI harness"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
gui = ["uiautomation>=2.0"]

[project.scripts]
auto-cli = "auto_cli.cli:main"

[tool.setuptools.packages.find]
include = ["auto_cli*"]
